[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forensica"
version = "0.1.0"
description = "Forensica - A modular, evidence-first data recovery tool for digital forensics"
authors = [{ name = "Forensica Authors" }]
readme = "README.md"
requires-python = ">=3.9"
keywords = ["forensics", "data-recovery", "imaging", "carving", "hashing"]
classifiers = [
	"Programming Language :: Python :: 3",
	"License :: OSI Approved :: MIT License",
	"Environment :: Console",
	"Topic :: Security :: Forensics",
]

[project.scripts]
forensica = "forensica.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]